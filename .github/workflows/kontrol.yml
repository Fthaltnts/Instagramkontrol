
name: Instagram Durum Kontrolu

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-durum-kontrolu
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Kaynak dosyalar
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gerekli paketler ve tarayici
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'playwright>=1.55,<2'
          python -m playwright install --with-deps chromium

      - name: Durumu kontrol et ve Telegram'a gonder
        env:
          TARGET_USERNAME: ${{ secrets.TARGET_USERNAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python browser_check.py

      - name: Degisen durumu kaydet
        if: success()
        run: |
          if [ -z "$(git status --porcelain -- state.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update monitoring status [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
